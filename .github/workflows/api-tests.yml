name: API tests

on:
  pull_request:
  push:
    branches: [main, Medusa]

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_DB: commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
      DATABASE_URL: postgresql://commerce:commerce@localhost:5432/commerce
      JWT_SECRET: ci-jwt-secret
      COOKIE_SECRET: ci-cookie-secret
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: node scripts/ci-run.mjs npm-pin npm install --global npm@11.12.1 --no-audit --no-fund
      - run: node scripts/ci-run.mjs install npm ci --no-fund
      - name: Run HTTP API integration tests
        run: node scripts/ci-run.mjs http npm run test:integration:http --workspace=@dtc/backend -- --json --outputFile=../../ci-evidence/http.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          retention-days: 7
