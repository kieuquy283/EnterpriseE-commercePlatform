name: CI
on:
  pull_request:
  push:
    branches: [main, Medusa]

permissions:
  contents: read

jobs:
  cloudformation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install cfn-lint==1.58.0
      - name: Install pinned AWS Guard binary
        run: |
          curl -fsSL https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.1/cfn-guard-v3-x86_64-linux-latest.tar.gz -o "$RUNNER_TEMP/guard.tar.gz"
          echo "8c66efb19c63e6c2bf26b9a41bbcf2f85baa8a937b01d350940194faaf64cf1d  $RUNNER_TEMP/guard.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/guard"
          tar -xzf "$RUNNER_TEMP/guard.tar.gz" -C "$RUNNER_TEMP/guard"
          echo "$RUNNER_TEMP/guard/cfn-guard-v3-x86_64-linux-latest" >> "$GITHUB_PATH"
      - run: cfn-lint --regions ap-southeast-2 --template deploy/cloudformation/foundation.yaml deploy/cloudformation/data.yaml deploy/cloudformation/app.yaml deploy/cloudformation/retained-guard.yaml
      - run: cfn-guard validate --rules deploy/cloudformation/security.guard --data deploy/cloudformation/foundation.yaml deploy/cloudformation/data.yaml deploy/cloudformation/app.yaml deploy/cloudformation/retained-guard.yaml --output-format json
      - run: python -m unittest discover -s deploy/cloudformation/tests -v
      - run: python -m py_compile deploy/cloudformation/manage.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - run: node --check deploy/cloudformation/runtime/backend-entrypoint.cjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/commerce_test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret
      COOKIE_SECRET: ci-only-cookie-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install H&M image test dependencies
        run: python -m pip install -r scripts/hm/requirements.txt
      - name: Offline recommendation fixture tests
        run: python -m unittest discover -s scripts/hm/tests -v
      - run: npm run test:unit --workspace=@dtc/backend
      - run: docker compose config --quiet
      - run: npm test
      - run: npm run lint --workspace=@dtc/backend
      - run: npm run lint --workspace=@dtc/storefront
      - run: npm run typecheck --workspace=@dtc/backend
      - run: npm run typecheck --workspace=@dtc/storefront
      - run: npm run build --workspace=@dtc/backend
      - run: npm run build --workspace=@dtc/storefront
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_placeholder
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  image:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/backend/Dockerfile -t commerce-backend:${{ github.sha }} -t commerce-backend:local .
      - run: docker compose up -d --wait --wait-timeout 180 backend worker
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=150 backend worker migrate postgres redis
      - run: docker build -f apps/storefront/Dockerfile --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_ci_build_placeholder --build-arg NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://localhost:9000 -t commerce-storefront:${{ github.sha }} .

  # Deployment is intentionally separate: connect this artifact to a cloud
  # environment and add required environment approval before production rollout.
