name: CI
on:
  pull_request:
  push:
    branches: [main, Medusa]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs docs npm run docs:check
      - run: node scripts/ci-run.mjs npm-pin npm install --global npm@11.12.1 --no-audit --no-fund
      - run: npm ci --workspace=presentation --include-workspace-root=false --ignore-scripts --no-audit --no-fund
      - run: node scripts/ci-run.mjs presentation-test npm run presentation:test
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs presentation-build npm run presentation:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          retention-days: 7

  cloudformation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install cfn-lint==1.58.0
      - name: Install pinned AWS Guard binary
        run: |
          curl -fsSL https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.1/cfn-guard-v3-x86_64-linux-latest.tar.gz -o "$RUNNER_TEMP/guard.tar.gz"
          echo "8c66efb19c63e6c2bf26b9a41bbcf2f85baa8a937b01d350940194faaf64cf1d  $RUNNER_TEMP/guard.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/guard"
          tar -xzf "$RUNNER_TEMP/guard.tar.gz" -C "$RUNNER_TEMP/guard"
          echo "$RUNNER_TEMP/guard/cfn-guard-v3-x86_64-linux-latest" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs cfn-lint cfn-lint --regions ap-southeast-2 --template deploy/cloudformation/foundation.yaml deploy/cloudformation/data.yaml deploy/cloudformation/app.yaml deploy/cloudformation/retained-guard.yaml
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs cfn-guard cfn-guard validate --rules deploy/cloudformation/security.guard --data deploy/cloudformation/foundation.yaml deploy/cloudformation/data.yaml deploy/cloudformation/app.yaml deploy/cloudformation/retained-guard.yaml --output-format json
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs iac-tests python -m unittest discover -s deploy/cloudformation/tests -v
      - run: python -m py_compile deploy/cloudformation/manage.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: node --check deploy/cloudformation/runtime/backend-entrypoint.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/commerce_test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret
      COOKIE_SECRET: ci-only-cookie-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: node scripts/ci-run.mjs npm-pin npm install --global npm@11.12.1 --no-audit --no-fund
      - run: node scripts/ci-run.mjs install npm ci --no-fund
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs format npm run format:check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install H&M image test dependencies
        run: python -m pip install -r scripts/hm/requirements.txt
      - name: Offline recommendation fixture tests
        run: node scripts/ci-run.mjs offline-fixture python -m unittest discover -s scripts/hm/tests -v
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs unit npm run test:unit --workspace=@dtc/backend
      - run: node scripts/ci-run.mjs compose-config docker compose config --quiet
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs workspace-tests npm test
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs backend-lint npm run lint --workspace=@dtc/backend
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs storefront-lint npm run lint --workspace=@dtc/storefront
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs backend-types npm run typecheck --workspace=@dtc/backend
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs storefront-types npm run typecheck --workspace=@dtc/storefront
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs backend-build npm run build --workspace=@dtc/backend
      - if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs storefront-build npm run build --workspace=@dtc/storefront
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_build_placeholder
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gates-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          retention-days: 7

  security-policy:
    # Fail closed on unresolved security blockers; never infer approval from collection.
    # Repository protection is applied separately by its owner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: node scripts/ci-run.mjs npm-pin npm install --global npm@11.12.1 --no-audit --no-fund
      - name: Enforce dependency security policy
        run: node scripts/ci-run.mjs audit-policy node scripts/ci-audit.mjs --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          retention-days: 7

  browser-container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recommendation_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d recommendation_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: node scripts/ci-run.mjs npm-pin npm install --global npm@11.12.1 --no-audit --no-fund
      - run: node scripts/ci-run.mjs install npm ci --no-fund
      - run: npm exec --workspace=@dtc/storefront -- playwright install --with-deps chromium
      - name: Build, migrate, seed, smoke and run Chromium on disposable services
        run: node scripts/ci-run.mjs browser-stack bash scripts/ci-browser-stack.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-container-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ci-evidence/
            apps/storefront/playwright-report/
            apps/storefront/test-results/
          retention-days: 7

  # HTTP CI includes persisted Staff deny, Admin allow and customer/session boundaries.
  # Restricted Staff operations and assigned-order access remain separate BE-08 work.
  # Deployment and branch protection require separate owner authorization.
